<head>

  <!-- Applique le thème choisi avant l'affichage (évite un flash) -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">

  <div class="layout" id="layout">

    <aside class="sidebar" id="sidebar">
      <a class="identity" href="#/">
        <img class="avatar" src="assets/img/photo.jpg" alt="">
        <span class="identity-text">
          <strong>Maxime ARNAU</strong>
          <span>Gameplay Programmer</span>
        </span>

      <nav class="nav" id="main-nav">
        <a class="nav-link" href="#/" data-route="home"><span data-icon="home"></span><span class="label" data-i18n="nav.home">Accueil</span></a>

        </button>
      </div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <div class="main">

      <footer class="site-footer">© <span id="year">2026</span> Maxime ARNAU</footer>
    </div>

  <!-- Agrandissement des images -->
  <dialog class="lightbox" id="lightbox">
    <button type="button" class="icon-btn lightbox-close" id="lightbox-close"><span data-icon="close"></span></button>
    <img id="lightbox-img" alt="">

  <script src="js/i18n.js"></script>
